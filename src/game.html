<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>お好み焼き、ひっくり返せ！</title>

<style>
  :root { --ink:#2a160b; --cream:#fff4dc; --sauce:#5a2a12; --accent:#e8542b; --green:#4f8f33; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#140b06; overflow:hidden; touch-action:none;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; }
  #app { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); overflow:hidden; background:#22140c; user-select:none; -webkit-user-select:none; }
  #stage, #fx { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #fx { pointer-events:none; }
  #ui { position:absolute; inset:0; pointer-events:none; color:var(--cream); }
  #ui button { pointer-events:auto; font-family:inherit; cursor:pointer; }
  .panel { position:absolute; left:0; right:0; display:none; }
  .show { display:block; }
  #hud { top:0; padding:3% calc(var(--u)*11) 0; display:block; text-align:center; } /* 左右は消音ボタンの分あける */
  #hud h1 { margin:0; font-size:calc(var(--u)*5.8); letter-spacing:0; line-height:1.15; white-space:nowrap; font-weight:900; color:#ffd9a0;
    text-shadow:0 3px 0 #6b2c0e, 0 6px 14px rgba(0,0,0,.6); }
  #phase { margin-top:.6%; font-size:calc(var(--u)*4.6); line-height:1.3; opacity:.92; min-height:1.4em; text-shadow:0 2px 6px #000; }
  /* 生地を落として広げる */
  #pour { top:0; bottom:0; }
  .meter { position:absolute; left:3%; right:3%; top:14%; padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*2.4); border-radius:calc(var(--u)*3.4);
    background:rgba(20,10,4,.62); box-shadow:0 6px 18px rgba(0,0,0,.4); backdrop-filter:blur(2px); }
  .mrow { display:flex; justify-content:space-around; align-items:flex-end; }
  .mv { text-align:center; line-height:1; }
  .mv small { display:block; font-size:calc(var(--u)*4.3); opacity:.8; margin-bottom:calc(var(--u)*1); }
  .mv b { font-size:calc(var(--u)*14.5); font-weight:900; color:#ffe2a8; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .mv i { font-style:normal; font-size:calc(var(--u)*5.6); margin-left:.15em; opacity:.85; }
  .msub { text-align:center; font-size:calc(var(--u)*4.4); margin-top:calc(var(--u)*1.4); opacity:.95; }
  .msub b { font-variant-numeric:tabular-nums; color:#fff; }
  .msub .mul { color:#ff9d6e; font-weight:900; }
  .tbar { position:relative; height:calc(var(--u)*2.4); margin:calc(var(--u)*5.6) 0 calc(var(--u)*9.4); border-radius:99px;
    background:linear-gradient(90deg,#f5e3b0,#e9b265 45%,#b8622a); box-shadow:inset 0 1px 3px rgba(0,0,0,.5); }
  .tbar #tMark { position:absolute; top:-45%; width:calc(var(--u)*1.4); height:190%; margin-left:calc(var(--u)*-.7); background:#fff; border-radius:3px; box-shadow:0 0 0 2px #2a160b; left:0; transition:left .08s linear; }
  .tbar span { position:absolute; top:calc(100% + var(--u)*1.4); font-size:calc(var(--u)*3.6); line-height:1.2; opacity:.85; white-space:nowrap; }
  .tbar .l { left:0; } .tbar .r { right:0; text-align:right; }
  .tbar em { position:absolute; bottom:calc(100% + var(--u)*1.1); font-style:normal; font-size:calc(var(--u)*3.4); line-height:1; opacity:.8; transform:translateX(-50%); }
  .pctl { position:absolute; left:0; right:0; bottom:3.5%; padding:0 4%; text-align:center; }
  #pourHint { min-height:2.7em; line-height:1.35; display:flex; align-items:flex-end; justify-content:center; }
  .prow { display:flex; gap:2.5%; align-items:stretch; }
  #pourBtn { flex:1.3; border:none; border-radius:calc(var(--u)*4); font-size:calc(var(--u)*6); font-weight:900; color:var(--ink); line-height:1.2;
    background:linear-gradient(#fff8ea,#f0d6a6); box-shadow:0 6px 0 #8a4a1d, 0 10px 18px rgba(0,0,0,.45); padding:calc(var(--u)*2.8) 0; touch-action:none; }
  #pourBtn small { display:block; font-size:calc(var(--u)*3.7); margin-top:.15em; white-space:nowrap; font-weight:600; opacity:.8; }
  #pourBtn.on { transform:translateY(4px); box-shadow:0 2px 0 #8a4a1d; background:linear-gradient(#ffe2a6,#f3c16a); }
  #cookBtn { flex:1; padding:calc(var(--u)*2.6) 0; font-size:calc(var(--u)*8.2); letter-spacing:.04em; white-space:nowrap; }
  #cookBtn:disabled { filter:grayscale(.85) brightness(.7); }
  /* 焼き中 */
  #cook { bottom:5%; text-align:center; }
  .big { border:none; border-radius:999px; padding:calc(var(--u)*3.4) calc(var(--u)*12); font-size:calc(var(--u)*9.4); line-height:1.15; white-space:nowrap; font-weight:900;
    color:#fff; background:linear-gradient(#ff7a45,#d43d17); box-shadow:0 7px 0 #7c1f08, 0 12px 20px rgba(0,0,0,.5); letter-spacing:.08em; }
  .big:active { transform:translateY(5px); box-shadow:0 2px 0 #7c1f08; }
  .hint { font-size:calc(var(--u)*4.1); line-height:1.35; margin-bottom:3.5%; text-shadow:0 2px 6px #000; opacity:.95; }
  /* フリック */
  #flip { top:0; bottom:0; }
  #flip .guide { position:absolute; left:0; right:0; top:20%; padding:0 5%; text-align:center; font-size:calc(var(--u)*7); line-height:1.2; font-weight:900; color:#fff; text-shadow:0 3px 0 #7c1f08, 0 0 18px rgba(0,0,0,.8); }
  #flip .sub { display:block; font-size:calc(var(--u)*4.3); font-weight:600; line-height:1.4; margin-top:2.5%; }
  #flip .arrow { position:absolute; left:38%; bottom:20%; width:calc(var(--u)*14); height:calc(var(--u)*30); transform-origin:50% 100%; transform:rotate(24deg); animation:swipe 1.3s ease-in infinite; }
  @keyframes swipe { 0% { opacity:0; translate:0 30%; } 25% { opacity:1; } 80% { opacity:.9; translate:0 -25%; } 100% { opacity:0; translate:0 -35%; } }
  /* 結果 */
  #result { bottom:2.5%; padding:0 3.5%; }
  .sheet { background:rgba(255,246,228,.96); color:var(--ink); border-radius:calc(var(--u)*4); padding:calc(var(--u)*3.6) calc(var(--u)*3.2); box-shadow:0 12px 30px rgba(0,0,0,.55); }
  #rTitle { font-size:calc(var(--u)*12.5); font-weight:900; text-align:center; line-height:1.1; }
  #rWhy { text-align:center; font-size:calc(var(--u)*4.5); font-weight:700; line-height:1.4; margin:2% 0 3.5%; }
  .rrow { display:flex; gap:3%; align-items:center; }
  #rChart { width:42%; flex:none; aspect-ratio:1.15; background:#fff; border-radius:calc(var(--u)*2); }
  #rScore { flex:1; min-width:0; text-align:center; font-size:calc(var(--u)*4.1); line-height:1.4; }
  #rStats { font-size:calc(var(--u)*4.3); line-height:1.5; margin-top:calc(var(--u)*2.2); text-align:center; }
  #rStats b, #rScore b { font-variant-numeric:tabular-nums; }
  #ui .nw { white-space:nowrap; }
  #rScore .sc { font-size:calc(var(--u)*13); font-weight:900; color:var(--accent); line-height:1.1; }
  .rbtns { display:flex; justify-content:center; align-items:center; gap:calc(var(--u)*3); margin-top:4%; }
  #rBtn { display:block; font-size:calc(var(--u)*7); padding:calc(var(--u)*2.8) calc(var(--u)*9); }
  /* 大失敗の結果：ぶちまけた具材（いちばんおもしろい所）が見えるよう、シートを小さく下に寄せる */
  #result.compact { bottom:1.8%; }
  #result.compact .sheet { padding:calc(var(--u)*2.2) calc(var(--u)*3) calc(var(--u)*2.6); background:rgba(255,246,228,.93); }
  #result.compact .rhead { display:flex; align-items:baseline; justify-content:center; gap:calc(var(--u)*4); }
  #result.compact #rTitle { font-size:calc(var(--u)*9); }
  #result.compact #rWhy { font-size:calc(var(--u)*3.8); margin:1% 0 2%; }
  #result.compact #rChart { width:27%; }
  #result.compact #rScore { font-size:calc(var(--u)*3.6); line-height:1.35; }
  #result.compact #rScore { flex:none; }
  #result.compact #rScore .sc { font-size:calc(var(--u)*9); }
  #result.compact #rScore > :not(.sc) { display:none; } /* 0点なので内訳は省く */
  #result.compact #rStats { flex:1; min-width:0; }
  #result.compact #rStats { font-size:calc(var(--u)*3.6); line-height:1.4; margin-top:0; text-align:left; }
  #result.compact .rrow { gap:3.5%; }
  #result.compact .rbtns { margin-top:3%; }
  #result.compact #rBtn { font-size:calc(var(--u)*6); padding:calc(var(--u)*2.2) calc(var(--u)*8); }
  #result.compact .sub2 { font-size:calc(var(--u)*5); padding:calc(var(--u)*2.2) calc(var(--u)*5); }
  /* Xに投稿 */
    font-size:calc(var(--u)*5.4); padding:calc(var(--u)*2.6) calc(var(--u)*6); box-shadow:0 5px 0 #000, 0 9px 16px rgba(0,0,0,.45); }
  #rMsg { margin-top:calc(var(--u)*2); }
  /* 裏面 */
  #bake { bottom:8%; text-align:center; }
  .bar { width:70%; height:calc(var(--u)*3); margin:2% auto 0; border-radius:99px; background:rgba(0,0,0,.45); overflow:hidden; border:2px solid rgba(255,240,210,.6); }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ffb35c,#e0611f); }
  /* 仕上げ */
  #finish { bottom:2.5%; padding:0 2.5%; }
  #finish .hint { text-align:center; }
  .tools { display:flex; gap:1.8%; }
  .tool { flex:1; border:none; border-radius:calc(var(--u)*3); padding:calc(var(--u)*1.8) 0 calc(var(--u)*1.6); background:rgba(255,246,228,.92); color:var(--ink); line-height:1.15; white-space:nowrap;
    font-size:calc(var(--u)*4.4); font-weight:800; box-shadow:0 4px 0 rgba(90,40,10,.8); }
  .tool .ic { display:block; width:calc(var(--u)*7.5); height:calc(var(--u)*7.5); margin:0 auto calc(var(--u)*1.2); border-radius:50%; }
  .tool.on { background:#ffd27a; outline:3px solid #fff; transform:translateY(-6%); }
  #done { width:100%; margin-top:3%; font-size:calc(var(--u)*7.6); padding:calc(var(--u)*2.6) 0; }
  /* 完成写真 */
  #photo { top:0; bottom:0; background:rgba(20,10,4,.82); }
  .polaroid { position:absolute; left:9%; right:9%; top:8.5%; background:#fdfbf6; padding:4% 4% 0; box-shadow:0 18px 40px rgba(0,0,0,.6); transform:rotate(-2.5deg); animation:drop .6s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes drop { from { transform:translateY(-30%) rotate(-12deg); opacity:0; } }
  .polaroid img { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; background:#000; }
  .polaroid .cap { color:#3a2414; text-align:center; padding:3.5% 0 4.5%; font-size:calc(var(--u)*5.4); font-weight:800; line-height:1.3; }
  .polaroid .cap small { display:block; font-weight:600; font-size:calc(var(--u)*3.9); line-height:1.35; opacity:.8; margin-top:1.5%; }
  .pbot { position:absolute; left:0; right:0; bottom:4%; padding:0 6%; display:flex; flex-direction:column; align-items:center; }
  #pMsg { color:#f3e2c4; margin:calc(var(--u)*2.4) 0 calc(var(--u)*3.4); opacity:.9; }
  #again { font-size:calc(var(--u)*7); padding:calc(var(--u)*2.6) calc(var(--u)*9); white-space:nowrap; }
  /* タイトル */
  #title { top:0; bottom:0; text-align:center;
    background:linear-gradient(rgba(20,10,4,.78) 0%, rgba(20,10,4,.25) 34%, rgba(20,10,4,0) 50%, rgba(20,10,4,.35) 66%, rgba(20,10,4,.86) 100%); }
  .logo { position:absolute; left:0; right:0; top:9%; line-height:1; font-weight:900; animation:logoIn .7s cubic-bezier(.2,1.5,.4,1) both; }
  .logo .l1 { display:block; font-size:calc(var(--u)*10); color:#fff4dc; letter-spacing:.04em; transform:rotate(-3deg);
    text-shadow:0 4px 0 #6b2c0e, 0 8px 16px rgba(0,0,0,.6); }
  .logo .l2 { display:block; margin-top:calc(var(--u)*2.4); font-size:calc(var(--u)*13.4); color:#ffd27a; white-space:nowrap; transform:rotate(-3deg);
    text-shadow:0 calc(var(--u)*1) 0 #c4321a, 0 calc(var(--u)*2) 0 #6b1c08, 0 calc(var(--u)*3.4) 22px rgba(0,0,0,.7); }
  .logo .l2 span { display:inline-block; animation:hop 2.6s ease-in-out infinite; }
  .logo .tag { display:block; margin-top:calc(var(--u)*5.6); font-size:calc(var(--u)*4.6); font-weight:700; color:#fff4dc; letter-spacing:.06em; text-shadow:0 2px 6px #000; }
  @keyframes logoIn { from { opacity:0; transform:translateY(-25%) scale(.8); } }
  @keyframes hop { 0%,70%,100% { transform:translateY(0) rotate(0); } 78% { transform:translateY(-22%) rotate(-8deg); } 86% { transform:translateY(0) rotate(4deg); } }
  .tbot { position:absolute; left:0; right:0; bottom:4.5%; padding:0 5%; display:flex; flex-direction:column; align-items:center; }
  .steps { display:flex; gap:2%; width:100%; margin-bottom:calc(var(--u)*7); }
  .steps div { flex:1; padding:calc(var(--u)*2.4) 0 calc(var(--u)*2); border-radius:calc(var(--u)*3); background:rgba(255,246,228,.92); color:var(--ink);
    font-size:calc(var(--u)*4.1); font-weight:800; line-height:1.25; box-shadow:0 4px 0 rgba(90,40,10,.8); }
  .steps b { display:block; width:calc(var(--u)*6.4); height:calc(var(--u)*6.4); line-height:calc(var(--u)*6.4); margin:0 auto calc(var(--u)*1.2); border-radius:50%;
    background:var(--accent); color:#fff; font-size:calc(var(--u)*4); }
  #startBtn { font-size:calc(var(--u)*10); padding:calc(var(--u)*3.4) calc(var(--u)*16); animation:pulse 1.6s ease-in-out infinite; }
  #startBtn:active { animation:none; }
  @keyframes pulse { 0%,100% { scale:1; } 50% { scale:1.05; } }
  .tnote { margin-top:calc(var(--u)*4.4); font-size:calc(var(--u)*3.6); opacity:.75; text-shadow:0 2px 6px #000; }
  /* タイトルへ戻る（控えめな副ボタン） */
  .sub2 { border:none; border-radius:999px; padding:calc(var(--u)*2.8) calc(var(--u)*6); font-size:calc(var(--u)*5.6); font-weight:800; white-space:nowrap; line-height:1.15;
    color:var(--ink); background:linear-gradient(#fff8ea,#f0d6a6); box-shadow:0 6px 0 #8a4a1d, 0 10px 18px rgba(0,0,0,.35); }
  .sub2:active { transform:translateY(4px); box-shadow:0 2px 0 #8a4a1d; }
  .pbtns { display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*4.4); }
  /* 消音ボタン（右上、全画面共通） */
  #muteBtn { position:absolute; top:calc(var(--u)*2.2); right:calc(var(--u)*2); z-index:5; width:calc(var(--u)*9); height:calc(var(--u)*9); padding:0; border:none; border-radius:50%;
    background:rgba(20,10,4,.55); box-shadow:0 0 0 2px rgba(255,244,220,.55); display:flex; align-items:center; justify-content:center; }
  #muteBtn svg { width:62%; height:62%; fill:none; stroke:#fff4dc; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  #muteBtn .off { display:none; }
  #muteBtn.muted .on { display:none; } #muteBtn.muted .off { display:inline; }
  #muteBtn.muted { background:rgba(120,30,10,.7); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #toast { position:absolute; left:0; right:0; top:34%; text-align:center; font-size:calc(var(--u)*15); white-space:nowrap; font-weight:900; color:#fff;
    text-shadow:0 5px 0 #7c1f08, 0 0 24px rgba(0,0,0,.8); opacity:0; pointer-events:none; transform:scale(.6); transition:opacity .15s, transform .25s cubic-bezier(.2,1.6,.4,1); }
  #toast.on { opacity:1; transform:scale(1); }
</style>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <canvas id="fx"></canvas>
  <div id="flash"></div>
  <div id="ui">
    <div id="title" class="panel">
      <div class="logo"><span class="l1">お好み焼き、</span><span class="l2"><span>ひ</span><span style="animation-delay:.08s">っ</span><span style="animation-delay:.16s">く</span><span style="animation-delay:.24s">り</span><span style="animation-delay:.32s">返</span><span style="animation-delay:.4s">せ</span><span style="animation-delay:.48s">！</span></span>
        <span class="tag">注いで、広げて、焼いて、返す。</span></div>
      <div class="tbot">
        <div class="steps"><div><b>1</b>注いで<br>広げる</div><div><b>2</b>焼き色を<br>見極める</div><div><b>3</b>フリックで<br>返す！</div></div>
        <button class="big" id="startBtn">はじめる</button>
        <div class="tnote">音が出ます（右上のボタンで消音）</div>
      </div>
    </div>
    <div id="hud" class="panel show"><h1>お好み焼き、ひっくり返せ！</h1><div id="phase"></div></div>

    <div id="pour" class="panel">
      <div class="meter">
        <div class="mrow">
          <div class="mv"><small>直径</small><b id="mDia">0.0</b><i>cm</i></div>
          <div class="mv"><small>厚み</small><b id="mThk">0.0</b><i>cm</i></div>
        </div>
        <div class="msub">生地 <b id="mVol">0</b> ml　／　この厚さの最高 <span class="mul" id="mMax">100点</span></div>
        <div class="tbar"><em style="left:11.8%">1cm</em><em style="left:41.2%">2cm</em><em style="left:70.6%">3cm</em><i id="tMark"></i>
          <span class="l">薄い：返しやすい<br>でも崩れやすい</span><span class="r">厚い：重く返しにくい<br>崩れにくい・高得点</span></div>
      </div>
      <div class="pctl">
        <div class="hint" id="pourHint">ボタンを長押しして、ボウルから生地を落とす</div>
        <div class="prow">
          <button id="pourBtn">長押しで落とす<small>長く押すほど どっと出る</small></button>
          <button class="big" id="cookBtn" disabled>焼く →</button>
        </div>
      </div>
    </div>

    <div id="cook" class="panel">
      <div class="hint">泡・湯気・ふちの色を見て、いい頃合いで</div>
      <button class="big" id="flipBtn">返す！</button>
    </div>

    <div id="flip" class="panel">
      <div class="guide">ヘラを上へフリック！<span class="sub"><span class="nw">速さと角度で決まる</span><span class="nw">（真上より少し右斜めが目安）</span></span></div>
      <svg class="arrow" viewBox="0 0 40 90"><path d="M20 88 V14" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".9"/><path d="M5 26 L20 4 L35 26" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </div>

    <div id="result" class="panel">
      <div class="sheet">
        <div class="rhead"><div id="rTitle"></div></div>
        <div id="rWhy"></div>
        <div class="rrow"><canvas id="rChart" width="300" height="260"></canvas><div id="rScore"></div></div>
        <div id="rStats"></div>
        <div class="rbtns" id="rBtns"><button class="big" id="rBtn"></button><button class="sub2" id="rToTitle">タイトルへ</button></div>
      </div>
    </div>

    <div id="bake" class="panel">
      <div class="hint">裏面を焼いています…</div>
      <div class="bar"><i id="bakeBar"></i></div>
    </div>

    <div id="finish" class="panel">
      <div class="hint">仕上げは自由に（採点なし）<br>ドラッグで塗る・かける・散らす</div>

var clock = new THREE.Clock(), time = 0, steamAcc = 0, popAcc = 0;
function update(rdt) {
  time += rdt;
  var D = disc;
  if (state.hitStop > 0) { state.hitStop -= rdt; rdt *= 0.08; }
  var dt = rdt * state.timeScale;
  state.phaseT = (state.phaseT || 0) + rdt;

  if (state.phase === 'title' && D) {
    titleCam(state.phaseT);
    steamAcc += 10 * rdt;
    while (steamAcc > 1) { steamAcc--; var ta = rr(0, 7), tr = Math.sqrt(rand()) * D.R; emitSteam(X0 + Math.cos(ta) * tr, D.h + 0.005, Math.sin(ta) * tr * 0.9, false, false); }
  }

  if (state.phase === 'pour') {
    var P = L.POUR, full = state.shape.volume >= P.vMax - 1e-12;
    var tTilt = pour.down ? (full ? 1.3 : 0.6 + 0.65 * L.smoothstep(0, P.rampTime, pour.holdT)) : 0.25;
    pour.tilt += (tTilt - pour.tilt) * (1 - Math.exp(-rdt * 10));
    bowl.rotation.z = pour.tilt;
    // 落とさない間はボウルを奥右へ退ける（広げる生地が隠れないように）
    var tAway = pour.down ? 0 : 1;
    pour.away = (pour.away == null ? 1 : pour.away) + (tAway - (pour.away == null ? 1 : pour.away)) * (1 - Math.exp(-rdt * 9));
    bowl.position.set(BOWL_LIP.x + 0.13 * pour.away, BOWL_LIP.y + 0.03 * pour.away, BOWL_LIP.z - 0.06 * pour.away);
    if (pour.down && !full && pour.away < 0.08) {
      pour.holdT += rdt;
      pour.rate = L.pourRate(pour.holdT);
      state.shape = L.pourStep(state.shape, pour.rate * rdt);
      var sr = 0.0028 + 0.0075 * (pour.rate - P.rateMin) / (P.rateMax - P.rateMin), top = disc.group.visible ? disc.h : 0;
      stream.visible = true; stream.scale.set(sr, BOWL_LIP.y - top, sr);
      stream.position.set(BOWL_LIP.x - sr * 0.6, (BOWL_LIP.y + top) / 2, BOWL_LIP.z);
      pour.glugAcc += rdt * (3 + 6 * pour.rate / P.rateMax);
      if (pour.glugAcc > 1) { pour.glugAcc = 0; Sfx.burst({ type: 'lowpass', f0: rr(400, 900), gain: 0.18, dur: rr(0.06, 0.14) }); }
    } else { pour.rate = 0; stream.visible = false; }
    syncDiscToShape();
    if (disc.group.visible && time - disc.lastTopDraw > 0.12) { drawTop(disc, 0); disc.lastTopDraw = time; }
    setBowlLevel(1 - state.shape.volume / P.vMax);
    if (ladle.visible) ladle.rotation.y = Math.sin(time * 9) * 0.15;
    var areaK = state.shape.volume > 0 ? Math.min(1, L.area(state.shape.diameter) / 0.05) : 0;
    Sfx.sizzle(0.25 + 0.5 * areaK);
    if (disc.group.visible && rand() < rdt * 6) { var a2 = rr(0, 7), r2 = Math.sqrt(rand()) * disc.R; emitSteam(X0 + Math.cos(a2) * r2, disc.h + 0.004, Math.sin(a2) * r2, false, false); }

  }

  if (state.phase === 'result' || state.phase === 'bake' || state.phase === 'finish') {
    if (D && D.group.visible && state.phase !== 'finish') { steamAcc += 8 * rdt; while (steamAcc > 1) { steamAcc--; emitSteam(state.discX + rr(-D.R, D.R) * 0.8, D.h, rr(-D.R, D.R) * 0.6, false, false); } }
  }

function adaptResolution(rawDt) {
  if (FIXED_PR) return;
  frameAvg += (rawDt * 1000 - frameAvg) * 0.1; prCooldown -= rawDt;
  if (prCooldown > 0) return;
  var next = curPR;
  if (frameAvg > 40 && curPR > 0.5) next = Math.max(0.5, curPR * 0.8);
  else if (frameAvg < 18 && curPR < maxPR) next = Math.min(maxPR, curPR * 1.15);
  if (next !== curPR) { curPR = next; renderer.setPixelRatio(curPR); renderer.setSize(W, H, false); prCooldown = 1.0; }
}
var manual = false; // 告知動画の撮影中は自分では進めず、__game.step(dt) で1コマずつ進める
function frame() {
  var raw = clock.getDelta();
  if (manual) { requestAnimationFrame(frame); return; }
  var dt = Math.min(0.05, raw);
  adaptResolution(Math.min(raw, 0.5));
  update(dt);
  if (state.phase !== 'photo') renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// 自動テスト用の読み取り口（ゲーム進行には影響しない）
window.__oko = {
  get phase() { return state.phase; },
  audio: function () { return { muted: Sfx.muted, ctx: Sfx.ctx ? Sfx.ctx.state : null, gain: Sfx.master ? Sfx.master.gain.value : null }; },
  info: function () { return { size: state.size && { diameter: state.size.diameter, thickness: state.size.thickness, volume: state.size.volume }, shape: { volume: state.shape.volume, diameter: state.shape.diameter, thickness: state.shape.volume > 0 ? L.thicknessFrom(state.shape.volume, state.shape.diameter) : 0 },
    meter: { dia: $('mDia').textContent, thk: $('mThk').textContent, vol: $('mVol').textContent, max: $('mMax').textContent }, kinds: parts.reduce(function (o, p) { o[p.kind] = (o[p.kind] || 0) + 1; return o; }, {}), d: state.d, flipD: state.flipD, flick: state.flick, judgement: state.judgement && { tier: state.judgement.tier, e: state.judgement.e, flickPenalty: state.judgement.flickPenalty }, breakdown: state.judgement && state.size ? L.scoreBreakdown(state.size, state.judgement) : null, score: state.score, particles: parts.length, flakes: flakes.length, discY: disc ? disc.group.position.y : null, discRot: disc ? disc.group.rotation.z : null }; },
  viewH: function () { return H; },
  discScreen: function () { var c = discScreen(), r = app.getBoundingClientRect(); return { x: c.x + r.left, y: c.y + r.top, r: c.r }; },
  // 宙を舞っている間も含めた、円盤の中心の画面位置（#app 内の座標。OGP画像の切り抜きに使う）
  discCenter: function () { if (!disc) return null; var p = disc.group.getWorldPosition(new THREE.Vector3()).project(camera); return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H }; },
  pixelRatio: function () { return renderer.getPixelRatio(); },
  appRect: function () { var r = app.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }
};

// 告知動画の撮影用の入口（tools/promo/。スキル promo-video の約束に合わせる）。普段の遊びには影響しない
window.__game = {
  manual: function (on) { manual = !!on; if (!on) clock.getDelta(); },
  step: function (dt) { update(dt); if (state.phase !== 'photo') renderer.render(scene, camera); },
  state: function () {
    var sh = state.shape;
    return { phase: state.phase, d: state.d, percent: L.donenessPercent(state.d), flipD: state.flipD, volume: sh.volume, diameter: sh.diameter,
      thickness: sh.volume > 0 ? L.thicknessFrom(sh.volume, sh.diameter) : 0, tier: state.judgement && state.judgement.tier, score: state.score,
      disc: disc && disc.group.visible && (state.phase !== 'pour' || sh.volume > 0) ? discScreen() : null, discRot: disc ? disc.group.rotation.z : null };
  },
  click: function (id) { $(id).click(); },        // ボタンと同じ処理（startBtn / cookBtn / flipBtn / rBtn / done / again など）
  pour: function (on) { setPouring(!!on); },
  newRound: function () { goPour(); },             // 「もう一度焼く」と同じ（どの画面からでも新しく注ぐところから）       // 「生地を落とす」ボタンの長押し
  touchDown: function (x, y) { touchDown({ x: x, y: y }); },
  touchMove: function (x, y) { touchMove({ x: x, y: y }); },
  touchUp: function () { endPointer(); },
  tool: function (name) { document.querySelector('.tool[data-tool="' + name + '"]').click(); },
  // 速さ・角度のフリックになる、ms ミリ秒のスワイプの移動量（px）。成功の窓の中心は center
  swipeFor: function (speed, angle, ms) { return L.swipeForFlick({ speed: speed, angle: angle }, ms, H); },
  flipWindow: function () { return L.flipWindow(state.size, state.flipD); },
  drainEvents: function () { var e = events; events = []; return e; },
  audio: {
    capture: function (on) { Sfx.cap = on ? [] : null; Sfx.capSizzle = -1; },
    drain: function () { if (!Sfx.cap) return []; var q = Sfx.cap; Sfx.cap = []; return q; },
    render: function (ctx, name, args, when) { Sfx.render(ctx, name, args, when); }
  }
};

goTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
